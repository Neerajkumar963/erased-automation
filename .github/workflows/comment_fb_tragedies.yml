name: Comment FB Tragedies (Part 4)
on:
  schedule:
    # 7:35 PM IST (14:05 UTC) - Runs 5 minutes after the Part 4 reel goes live natively
    - cron: '05 14 * * *'
  workflow_dispatch:

jobs:
  comment_post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run FB Watchdog
      env:
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      run: |
        python comment_facebook_part4_reel.py
