name: Auto-Publisher (Master Queue)
on:
  schedule:
    # 5:30 AM IST (00:00 UTC) - Current Affairs
    - cron: '00 00 * * *'
    # 5:35 AM IST (00:05 UTC) - Facebook Comment (Current Affairs)
    - cron: '05 00 * * *'
    # 11:00 AM IST (05:30 UTC) - Family Tragedies Part 4
    - cron: '30 05 * * *'
    # 1:30 PM IST (08:00 UTC) - CIA Declassified
    - cron: '00 08 * * *'
    # 7:30 PM IST (14:00 UTC) - Family Tragedies Part 4
    - cron: '00 14 * * *'
    # 7:35 PM IST (14:05 UTC) - Facebook Comment (Family Tragedies Part 4)
    - cron: '05 14 * * *'
    # 10:30 PM IST (17:00 UTC) - CIA Declassified
    - cron: '00 17 * * *'
  workflow_dispatch:

jobs:
  publish_post:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Facebook Comments (if scheduled time)
      env:
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      shell: bash
      run: |
        # Check current UTC hour and minute
        HOUR=$(date -u +"%H")
        MINUTE=$(date -u +"%M")
        
        # 00:05 UTC -> 5:35 AM IST (Current Affairs Comment)
        if [ "$HOUR" == "00" ] && [ "$MINUTE" == "05" ]; then
          echo "Running Current Affairs Facebook Comment script..."
          python comment_fb_current_affairs.py || true
        # 14:05 UTC -> 7:35 PM IST (Family Tragedies Part 4 Comment)
        elif [ "$HOUR" == "14" ] && [ "$MINUTE" == "05" ]; then
          echo "Running Family Tragedies Part 4 Facebook Comment script..."
          python comment_facebook_part4_reel.py || true
        else
          echo "Not a Facebook comment timeslot."
        fi

    - name: Run Master Publisher
      env:
        FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      shell: bash
      run: |
        HOUR=$(date -u +"%H")
        MINUTE=$(date -u +"%M")
        # Do not run Master Publisher if it's the 05 minute comment slot
        if [ "$MINUTE" != "05" ]; then
          python master_publisher.py
        else
          echo "Skipping Master Publisher for comment slot."
        fi

    - name: Commit Updated Master DB
      # Only commit if the DB was updated (queue consumed)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        git add master_monthly_schedule.json
        git diff --staged --quiet || git commit -m "Consume published video from master queue"
        git push
