name: Schedule Instagram & Facebook Reels

on:
  repository_dispatch:
    types: [schedule_trigger]
  schedule:
    # Current Affairs (5:30 AM IST / 00:00 UTC) from 8 July to 29 July
    - cron: '0 0 8-29 7 *'
    # Old Hidden History Afternoon Slot (1:30 PM IST / 08:00 UTC) from 12 July to 18 July
    - cron: '0 8 12-18 7 *'
    # Old Hidden History Night Slot (10:30 PM IST / 17:00 UTC) from 12 July to 18 July
    - cron: '0 17 12-18 7 *'
    # Family Tragedies Part 4 (7:30 PM IST / 14:00 UTC) from 7 July to 20 July
    - cron: '0 14 7-20 7 *'
    # Image Slot Morning (11:00 AM IST / 05:30 UTC) from 8 July to 17 July
    - cron: '30 5 8-17 7 *'
  
  workflow_dispatch: # Allows manual run via GitHub UI with custom index
    inputs:
      post_index:
        description: 'Optional: Override Post Index to publish immediately (e.g. 25)'
        required: false
        default: ''
      post_type:
        description: 'Optional: Type of post (reel or image)'
        required: false
        default: 'reel'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run publishing script
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          if [ -n "${{ github.event.inputs.post_index }}" ]; then
            if [ "${{ github.event.inputs.post_type }}" = "image" ]; then
              python -u publish_instagram_image.py --idx ${{ github.event.inputs.post_index }}
            else
              python -u publish_instagram_reel.py --idx ${{ github.event.inputs.post_index }}
            fi
          else
            python -u publish_instagram_reel.py
            python -u publish_instagram_image.py
            python -u publish_instagram_part4_reel.py
            python -u comment_facebook_part4_reel.py
            python -u publish_instagram_current_affairs.py
            python -u comment_fb_current_affairs.py
          fi
